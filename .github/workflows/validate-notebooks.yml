name: Build and publish notebook previews

on:
  push:
    branches: [main]
    paths:
      - "**.ipynb"
      - "latex/**"
      - "scripts/**"
      - ".github/workflows/validate-notebooks.yml"
  pull_request:
    paths:
      - "**.ipynb"
      - "latex/**"
      - "scripts/**"
      - ".github/workflows/validate-notebooks.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install notebook preview tools
        run: python -m pip install "nbconvert[webpdf]"

      - name: Install LaTeX compiler
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base

      - name: Install Chromium dependencies
        run: python -m playwright install --with-deps chromium

      - name: Build HTML and PDF previews
        run: python scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
