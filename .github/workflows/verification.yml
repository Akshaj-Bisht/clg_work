name: Verification

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "server/**"
      - "processing/**"
      - "workers/**"
      - "supabase/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/verification.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "server/**"
      - "processing/**"
      - "workers/**"
      - "supabase/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/verification.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate coursework import manifest
        run: python scripts/validate_import.py
      - name: Run migration and import tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run processing tests
        run: python -m unittest discover -s processing/tests -p 'test_*.py'

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test -- --run